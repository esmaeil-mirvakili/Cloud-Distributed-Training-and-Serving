apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smirvaki-prometheus-data
  namespace: llm-serving
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smirvaki-prometheus-config
  namespace: llm-serving
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 30s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'llama-serving'
        metrics_path: /metrics
        static_configs:
          - targets:
              - smirvaki-llama-serving:2112
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smirvaki-prometheus
  namespace: llm-serving
  labels:
    app: smirvaki-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smirvaki-prometheus
  template:
    metadata:
      labels:
        app: smirvaki-prometheus
    spec:
      securityContext:
        fsGroup: 65534
      initContainers:
        - name: init-perms
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          command: ["sh", "-c", "chown -R 65534:65534 /prometheus"]
          volumeMounts:
            - name: data
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "200m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: smirvaki-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: smirvaki-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: smirvaki-prometheus
  namespace: llm-serving
spec:
  selector:
    app: smirvaki-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
