apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-serving

resources:
  - namespace.yaml
  - pvc-model.yaml
  - job-model-download.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - nginx-config.yaml
  - prometheus-deployment.yaml
  - grafana-deployment.yaml
  - hpa.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: smirvaki-llama-model-config
    envs:
      - model.env
