apiVersion: apps/v1
kind: Deployment
metadata:
  name: smirvaki-llama-serving
  namespace: llm-training
spec:
  template:
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: api
          env:
            - name: LLAMA_GPU_LAYERS
              value: "-1"
