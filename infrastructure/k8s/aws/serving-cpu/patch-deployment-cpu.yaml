apiVersion: apps/v1
kind: Deployment
metadata:
  name: smirvaki-llama-serving
  namespace: llm-training
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu
                    operator: DoesNotExist
