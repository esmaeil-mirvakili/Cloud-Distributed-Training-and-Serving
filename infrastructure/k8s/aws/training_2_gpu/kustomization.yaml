apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-training

resources:
  - ../training

patches:
  - path: patch-replicas.yaml
    target:
      kind: StatefulSet
      name: smirvaki-trainer

configMapGenerator:
  - name: training-params
    behavior: merge
    envs:
      - training.env
  - name: smirvaki-trainer-configs
    behavior: merge
    files:
      - deepspeed_zero2.json=deepspeed_zero2.json

generatorOptions:
  disableNameSuffixHash: true
