apiVersion: v1
kind: ServiceAccount
metadata:
  name: smirvaki-prometheus-adapter
  namespace: llm-training
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: smirvaki-prometheus-adapter
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - extension-apiserver-authentication
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - custom.metrics.k8s.io
    resources: ["*"]
    verbs: ["get", "list"]
  - apiGroups:
      - external.metrics.k8s.io
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: smirvaki-prometheus-adapter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: smirvaki-prometheus-adapter
subjects:
  - kind: ServiceAccount
    name: smirvaki-prometheus-adapter
    namespace: llm-training
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smirvaki-prometheus-adapter
  namespace: llm-training
  labels:
    app: smirvaki-prometheus-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smirvaki-prometheus-adapter
  template:
    metadata:
      labels:
        app: smirvaki-prometheus-adapter
    spec:
      serviceAccountName: smirvaki-prometheus-adapter
      containers:
        - name: adapter
          image: k8s.gcr.io/prometheus-adapter/prometheus-adapter:v0.10.0
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=6443
            - --metrics-relist-interval=30s
            - --prometheus-url=http://smirvaki-prometheus.llm-training.svc.cluster.local:9090
            - --config=/etc/adapter/rules/rules.yaml
            - --cert-dir=/tmp/certs
          ports:
            - containerPort: 6443
              name: https
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: rules
              mountPath: /etc/adapter/rules
            - name: certs
              mountPath: /tmp/certs
      volumes:
        - name: rules
          configMap:
            name: smirvaki-prometheus-adapter-rules
        - name: certs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: smirvaki-prometheus-adapter
  namespace: llm-training
spec:
  selector:
    app: smirvaki-prometheus-adapter
  ports:
    - name: https
      port: 6443
      targetPort: 6443
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.custom.metrics.k8s.io
spec:
  service:
    name: smirvaki-prometheus-adapter
    namespace: llm-training
  group: custom.metrics.k8s.io
  version: v1beta1
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.external.metrics.k8s.io
spec:
  service:
    name: smirvaki-prometheus-adapter
    namespace: llm-training
  group: external.metrics.k8s.io
  version: v1beta1
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
