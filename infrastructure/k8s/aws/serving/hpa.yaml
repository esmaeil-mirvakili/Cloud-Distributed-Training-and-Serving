apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smirvaki-llama-serving
  namespace: llm-training
  labels:
    app: smirvaki-llama-serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smirvaki-llama-serving
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: External
      external:
        metric:
          name: llama_request_ttft_p95_seconds
        target:
          type: AverageValue
          averageValue: "1.5"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: External
      external:
        metric:
          name: llama_gpu_utilization_percent
        target:
          type: AverageValue
          averageValue: "70"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
