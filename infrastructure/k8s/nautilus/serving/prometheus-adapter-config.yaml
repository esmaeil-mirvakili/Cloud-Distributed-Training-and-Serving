apiVersion: v1
kind: ConfigMap
metadata:
  name: smirvaki-prometheus-adapter-rules
  namespace: cse239fall2025
  labels:
    app: smirvaki-prometheus-adapter
data:
  rules.yaml: |
    rules:
      # Expose p95 latency from the llama_request_latency_seconds histogram.
      - seriesQuery: 'llama_request_latency_seconds_bucket{job="llama-serving"}'
        resources:
          overrides:
            namespace:
              resource: "namespace"
            pod:
              resource: "pod"
        name:
          as: "llama_request_latency_p95_seconds"
        metricsQuery: |
          histogram_quantile(
            0.95,
            sum(rate(<<.Series>>[5m])) by (<<.GroupBy>>, le)
          )
      # Expose p95 TTFT from the llama_request_ttft_seconds histogram.
      - seriesQuery: 'llama_request_ttft_seconds_bucket{job="llama-serving"}'
        resources:
          overrides:
            namespace:
              resource: "namespace"
            pod:
              resource: "pod"
        name:
          as: "llama_request_ttft_p95_seconds"
        metricsQuery: |
          histogram_quantile(
            0.95,
            sum(rate(<<.Series>>[5m])) by (<<.GroupBy>>, le)
          )
      # Expose GPU utilization percent from llama_gpu_utilization_percent gauge.
      - seriesQuery: 'llama_gpu_utilization_percent{job="llama-serving"}'
        resources:
          overrides:
            namespace:
              resource: "namespace"
            pod:
              resource: "pod"
        name:
          as: "llama_gpu_utilization_percent"
        metricsQuery: |
          avg_over_time(<<.Series>>[2m])
