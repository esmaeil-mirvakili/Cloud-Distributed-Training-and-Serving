      LLAMA_THREADS: "8"
      LLAMA_CONTEXT: "2048"
      LLAMA_GPU_LAYERS: "0"
      LLAMA_BATCH: "256"
    k6_script: scripts/k6/ramp_load.js
    k6_vus: 10
    k6_duration: 5m
    route: chat_completions
