cluster:
  namespace: llm-training
  context: ""
  base_env_file: infrastructure/k8s/aws/serving/model.env
  overlays:
    cpu: infrastructure/k8s/aws/serving-cpu
    gpu: infrastructure/k8s/aws/serving-gpu
  service_name: smirvaki-llama-serving
  service_port: 80
  local_service_port: 18002
  prometheus_service: smirvaki-prometheus
  prometheus_port: 9090
  local_prometheus_port: 19092
  download_job: smirvaki-llama-model-download
  deployment_name: smirvaki-llama-serving

prom_window: 5m

