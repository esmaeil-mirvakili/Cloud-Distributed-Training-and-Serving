  - name: tinyllama-gpu-steady
    overlay: gpu
    env_overrides:
      HF_MODEL_REPO: TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF
      HF_MODEL_FILE: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
      S3_MODEL_PREFIX: s3://llm-training-outputs/tinyllama
      S3_MODEL_FILE: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
      LLAMA_THREADS: "8"
      LLAMA_CONTEXT: "2048"
      LLAMA_GPU_LAYERS: "0"
      LLAMA_BATCH: "256"
    k6_script: scripts/k6/steady_load.js
    k6_vus: 10
    k6_duration: 5m
    route: chat_completions
  - name: tinyllama-gpu-ramp
    overlay: gpu
    env_overrides:
      HF_MODEL_REPO: TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF
      HF_MODEL_FILE: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
