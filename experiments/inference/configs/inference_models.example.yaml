cluster:
  namespace: llm-training
  context: ""  # optional; leave empty to use current kube context
  base_env_file: infrastructure/k8s/aws/serving/model.env
  overlays:
    cpu: infrastructure/k8s/aws/serving-cpu
    gpu: infrastructure/k8s/aws/serving-gpu
  service_name: smirvaki-llama-serving
  service_port: 80
  prometheus_service: smirvaki-prometheus
  prometheus_port: 9090
  local_service_port: 18000
  local_prometheus_port: 19090

# Prometheus rate window to compute latency/tokens/utilization
prom_window: 5m

load:
  prompts:
    - "Summarize the premise of the book Dune in one sentence."
    - "Give three bullet points explaining the transformer attention mechanism."
    - "Write a two-sentence LinkedIn post about cloud cost optimization."
  total_requests: 12
  concurrency: 3
  max_tokens: 128
  temperature: 0.1
  route: chat_completions

