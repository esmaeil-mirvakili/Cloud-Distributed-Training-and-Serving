cluster:
  namespace: llm-training
  context: ""  # optional kubecontext override
  base_env_file: infrastructure/k8s/aws/serving/model.env
  overlays:
    cpu: infrastructure/k8s/aws/serving-cpu
    gpu: infrastructure/k8s/aws/serving-gpu
  service_name: smirvaki-llama-serving
  service_port: 80
  local_service_port: 18001
  download_job: smirvaki-llama-model-download
  deployment_name: smirvaki-llama-serving

dataset:
  path: data/wildchat_quality_subset.jsonl   # JSONL with fields prompt/reference
  prompt_field: prompt
  reference_field: reference
  limit: 200

skip_bertscore: false

experiments:
  - name: tinyllama-q4-gpu
    overlay: gpu
    env_overrides:
      HF_MODEL_REPO: TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF
      HF_MODEL_FILE: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
      S3_MODEL_PREFIX: s3://llm-training-outputs/tinyllama
      S3_MODEL_FILE: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
      LLAMA_THREADS: "8"
      LLAMA_CONTEXT: "2048"
      LLAMA_BATCH: "256"
      LLAMA_MODEL_PATH: /models/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    temperature: 0.1
    max_tokens: 256

  - name: phi2-q6-gpu
    overlay: gpu
    env_overrides:
      HF_MODEL_REPO: TheBloke/phi-2-GGUF
      HF_MODEL_FILE: phi-2.Q6_K.gguf
      S3_MODEL_PREFIX: s3://llm-training-outputs/phi-2
      S3_MODEL_FILE: phi-2.Q6_K.gguf
      LLAMA_BATCH: "512"
      LLAMA_MODEL_PATH: /models/phi-2.Q6_K.gguf
    temperature: 0.1
    max_tokens: 256
